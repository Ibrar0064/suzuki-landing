name: Suzuki AI Landing Page Update

on:
  workflow_dispatch:
    inputs:
      offer_text:
        description: "Verified Suzuki offer information"
        required: true
        type: string

      test_only:
        description: "Test only - do not change website"
        required: true
        type: boolean
        default: true

      approve_update:
        description: "Approve website update"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-website:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -s index.html
          test -s system_prompt.txt
          echo "Required files found."

      - name: Check approval
        env:
          TEST_ONLY: ${{ inputs.test_only }}
          APPROVE_UPDATE: ${{ inputs.approve_update }}
        run: |
          if [ "$TEST_ONLY" != "true" ] && [ "$APPROVE_UPDATE" != "true" ]; then
            echo "Website update is not approved."
            exit 1
          fi

      - name: Ask Gemini to update website
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OFFER_TEXT: ${{ inputs.offer_text }}
          TEST_ONLY: ${{ inputs.test_only }}
        run: |

          python3 <<'PY'

          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          offer = os.environ.get("OFFER_TEXT", "").strip()
          test_only = os.environ.get("TEST_ONLY", "true").lower() == "true"

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )

          if not offer:
              raise RuntimeError(
                  "Offer information is empty."
              )

          with open(
              "system_prompt.txt",
              encoding="utf-8"
          ) as f:
              instructions = f.read()

          with open(
              "index.html",
              encoding="utf-8"
          ) as f:
              current_html = f.read()

          prompt = (
              "You maintain the Suzuki Kohat Motors landing page.\n\n"

              "WEBSITE INSTRUCTIONS:\n"
              + instructions +

              "\n\nVERIFIED OFFER:\n"
              + offer +

              "\n\nCURRENT WEBSITE:\n"
              + current_html +

              "\n\nIMPORTANT RULES:\n"
              "- Never invent prices.\n"
              "- Never invent discounts.\n"
              "- Never invent dates.\n"
              "- Never invent specifications.\n"
              "- Never invent features.\n"
              "- Never invent terms and conditions.\n"
              "- Do not redesign the website.\n"
              "- Do not remove unrelated sections.\n"
              "- Preserve the existing design.\n"
              "- Preserve responsive behavior.\n"
              "- Preserve the booking form.\n"
              "- Preserve the Formspree endpoint.\n"
              "- Preserve existing JavaScript.\n"
              "- Preserve existing contact information.\n"
              "- Make the smallest safe change necessary.\n"
              "- Return ONLY the complete index.html.\n"
              "- Do not use Markdown.\n"
              "- Do not use code fences.\n"
          )

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.8-flash:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:

                  raw = response.read().decode(
                      "utf-8"
                  )

          except urllib.error.HTTPError as error:

              body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(body)

              raise RuntimeError(
                  f"Gemini API returned HTTP {error.code}"
              )

          data = json.loads(raw)

          candidates = data.get("candidates") or []

          if not candidates:
              raise RuntimeError(
                  "Gemini returned no candidates."
              )

          parts = (
              candidates[0]
              .get("content", {})
              .get("parts", [])
          )

          generated_html = "".join(
              part.get("text", "")
              for part in parts
          ).strip()

          generated_html = generated_html.replace(
              chr(96) * 3 + "html",
              ""
          )

          generated_html = generated_html.replace(
              chr(96) * 3 + "HTML",
              ""
          )

          generated_html = generated_html.replace(
              chr(96) * 3,
              ""
          )

          generated_html = generated_html.strip()

          html_lower = generated_html.lower()

          required = [
              "<html",
              "</html>",
              "<body",
              "</body>"
          ]

          for marker in required:

              if marker not in html_lower:

                  raise RuntimeError(
                      "Gemini output missing "
                      + marker
                  )

          if (
              "formspree.io/f/xaeyknoa"
              not in html_lower
          ):

              raise RuntimeError(
                  "Formspree endpoint was removed."
              )

          if test_only:

              print(
                  "TEST MODE SUCCESS"
              )

              print(
                  "Gemini generated valid HTML."
              )

              print(
                  "Website was NOT changed."
              )

          else:

              with open(
                  "index.html",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(generated_html)

              print(
                  "index.html updated successfully."
              )

          PY

      - name: Validate website
        run: |

          test -s index.html

          grep -qi "<html" index.html

          grep -qi "</html>" index.html

          grep -qi "<body" index.html

          grep -qi "</body>" index.html

          grep -q "formspree.io/f/xaeyknoa" index.html

          echo "Website validation passed."

      - name: Commit and push
        if: ${{ inputs.test_only == false }}
        run: |

          git config user.name \
            "Suzuki AI Website Agent"

          git config user.email \
            "actions@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then

            echo "No changes detected."

            exit 0

          fi

          git commit \
            -m "Update Suzuki landing page with new offer"

          git push
