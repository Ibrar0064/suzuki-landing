name: Suzuki AI Landing Page Update

on:
  workflow_dispatch:
    inputs:
      offer_text:
        description: "Verified Suzuki offer information from Facebook"
        required: true
        type: string

      approve_update:
        description: "Allow Gemini to update index.html"
        required: true
        type: boolean
        default: false

      test_only:
        description: "Test Gemini without saving changes"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-website:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Verify required files
      # --------------------------------------------------
      - name: Verify repository files
        run: |
          set -e

          test -f index.html
          test -f system_prompt.txt

          echo "Repository files verified."
          echo "index.html found."
          echo "system_prompt.txt found."

      # --------------------------------------------------
      # 3. Check approval
      # --------------------------------------------------
      - name: Check approval
        env:
          APPROVE_UPDATE: ${{ inputs.approve_update }}
        run: |
          if [ "$APPROVE_UPDATE" != "true" ]; then
            echo "Website update was not approved."
            echo "Set 'Allow Gemini to update index.html' to true."
            exit 1
          fi

          echo "Website update approved."

      # --------------------------------------------------
      # 4. Send verified offer to Gemini
      # --------------------------------------------------
      - name: Update website with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OFFER_TEXT: ${{ inputs.offer_text }}
          TEST_ONLY: ${{ inputs.test_only }}
        run: |
          set -e

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import re

          api_key = os.environ.get("GEMINI_API_KEY")
          offer_text = os.environ.get("OFFER_TEXT", "").strip()
          test_only = os.environ.get("TEST_ONLY", "true").lower() == "true"

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret was not found."
              )

          if not offer_text:
              raise RuntimeError(
                  "No offer information was supplied."
              )

          # ------------------------------------------------
          # Read website instructions
          # ------------------------------------------------
          with open(
              "system_prompt.txt",
              "r",
              encoding="utf-8"
          ) as f:
              system_prompt = f.read()

          # ------------------------------------------------
          # Read current website
          # ------------------------------------------------
          with open(
              "index.html",
              "r",
              encoding="utf-8"
          ) as f:
              current_html = f.read()

          # ------------------------------------------------
          # Safety checks before sending to Gemini
          # ------------------------------------------------
          if len(current_html) < 500:
              raise RuntimeError(
                  "Current index.html appears unexpectedly small."
              )

          if "<html" not in current_html.lower():
              raise RuntimeError(
                  "Current index.html does not appear to be valid HTML."
              )

          # ------------------------------------------------
          # Prompt Gemini
          # ------------------------------------------------
          prompt = f"""
          You are the website maintenance AI for Suzuki Kohat Motors.

          Follow the instructions below exactly.

          ================================
          SYSTEM INSTRUCTIONS
          ================================

          {system_prompt}

          ================================
          VERIFIED NEW SUZUKI OFFER
          ================================

          {offer_text}

          ================================
          CURRENT index.html
          ================================

          {current_html}

          ================================
          TASK
          ================================

          Carefully review the verified offer.

          Update the existing Suzuki Kohat Motors website ONLY
          where necessary to add or update the verified offer.

          IMPORTANT RULES:

          1. Do NOT invent prices.
          2. Do NOT invent discounts.
          3. Do NOT invent specifications.
          4. Do NOT invent dates.
          5. Do NOT invent features.
          6. Do NOT invent terms and conditions.
          7. Do NOT invent contact information.
          8. Do NOT create fake customer reviews.
          9. Do NOT remove unrelated website sections.
          10. Do NOT redesign the website.
          11. Preserve the existing visual design.
          12. Preserve responsive/mobile behavior.
          13. Preserve the booking form.
          14. Preserve the existing Formspree endpoint.
          15. Preserve existing JavaScript functionality.
          16. Preserve existing navigation.
          17. Preserve existing contact information.
          18. Preserve existing vehicle information unless the
              verified offer specifically requires a change.
          19. Reuse the existing HTML/CSS structure wherever possible.
          20. Make the smallest safe change necessary.

          The website must remain a complete working HTML document.

          Return ONLY the complete replacement index.html.

          Do NOT use Markdown.
          Do NOT use ```html.
          Do NOT include explanations before or after the HTML.
          """

          # ------------------------------------------------
          # Gemini API
          # ------------------------------------------------
          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.8-flash:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.1,
                  "maxOutputTokens": 65536
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          # ------------------------------------------------
          # Call Gemini
          # ------------------------------------------------
          try:
              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:

                  response_body = response.read().decode(
                      "utf-8"
                  )

          except urllib.error.HTTPError as error:

              error_body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("Gemini API HTTP error:")
              print(error_body)

              raise RuntimeError(
                  f"Gemini API returned HTTP {error.code}"
              )

          except Exception as error:

              raise RuntimeError(
                  f"Gemini API request failed: {error}"
              )

          # ------------------------------------------------
          # Parse Gemini response
          # ------------------------------------------------
          try:
              result = json.loads(response_body)

              candidates = result.get(
                  "candidates",
                  []
              )

              if not candidates:
                  raise RuntimeError(
                      "Gemini returned no candidates."
                  )

              parts = (
                  candidates[0]
                  .get("content", {})
                  .get("parts", [])
              )

              generated_html = ""

              for part in parts:
                  if "text" in part:
                      generated_html += part["text"]

              generated_html = generated_html.strip()

          except Exception as error:

              print("Gemini raw response:")
              print(response_body)

              raise RuntimeError(
                  f"Could not parse Gemini response: {error}"
              )

          # ------------------------------------------------
          # Remove accidental Markdown fences
          # ------------------------------------------------
          generated_html = re.sub(
              r"^```html\s*",
              "",
              generated_html,
              flags=re.IGNORECASE
          )

          generated_html = re.sub(
              r"^```\s*",
              "",
              generated_html
          )

          generated_html = re.sub(
              r"\s*```$",
              "",
              generated_html
          )

          generated_html = generated_html.strip()

          # ------------------------------------------------
          # Validate generated HTML
          # ------------------------------------------------
          html_lower = generated_html.lower()

          required_markers = [
              "<html",
              "</html>",
              "<body",
              "</body>"
          ]

          for marker in required_markers:

              if marker not in html_lower:

                  raise RuntimeError(
                      f"Gemini output failed HTML validation: "
                      f"missing {marker}"
                  )

          # ------------------------------------------------
          # Preserve critical functionality
          # ------------------------------------------------
          critical_items = [
              "formspree.io/f/xaeyknoa"
          ]

          for item in critical_items:

              if item.lower() not in html_lower:

                  raise RuntimeError(
                      "Safety check failed: critical website "
                      f"item missing: {item}"
                  )

          # ------------------------------------------------
          # Test-only mode
          # ------------------------------------------------
          if test_only:

              print("")
              print("====================================")
              print("TEST MODE")
              print("====================================")
              print("")
              print(
                  "Gemini successfully generated valid HTML."
              )
              print(
                  "No files were changed."
              )
              print("")
              print(
                  f"Generated HTML length: "
                  f"{len(generated_html)} characters"
              )
              print("")

              with open(
                  "/tmp/generated_index.html",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(generated_html)

              print(
                  "Test completed successfully."
              )

              raise SystemExit(0)

          # ------------------------------------------------
          # Save website
          # ------------------------------------------------
          with open(
              "index.html",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(generated_html)

          print("")
          print("====================================")
          print("WEBSITE UPDATED")
          print("====================================")
          print("")
          print(
              f"New index.html size: "
              f"{len(generated_html)} characters"
          )
          PY

      # --------------------------------------------------
      # 5. Validate final HTML
      # --------------------------------------------------
      - name: Validate final website
        run: |
          set -e

          test -s index.html

          grep -qi "<html" index.html
          grep -qi "</html>" index.html
          grep -qi "<body" index.html
          grep -qi "</body>" index.html

          # Preserve Formspree form functionality
          grep -q "formspree.io/f/xaeyknoa" index.html

          echo "HTML validation passed."
          echo "Formspree validation passed."

      # --------------------------------------------------
      # 6. Show changes
      # --------------------------------------------------
      - name: Show website changes
        run: |
          git diff --stat
          git diff -- index.html

      # --------------------------------------------------
      # 7. Commit and push
      # --------------------------------------------------
      - name: Commit and push changes
        env:
          TEST_ONLY: ${{ inputs.test_only }}
        run: |
          set -e

          if [ "$TEST_ONLY" = "true" ]; then
            echo "Test mode enabled."
            echo "No commit will be created."
            exit 0
          fi

          git config user.name "Suzuki AI Website Agent"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No website changes detected."
            exit 0
          fi

          git commit \
            -m "Update Suzuki landing page with new offer"

          git push

          echo "Website changes successfully pushed to GitHub."
