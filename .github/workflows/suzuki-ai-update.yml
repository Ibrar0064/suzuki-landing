name: Suzuki AI Landing Page Update

on:
  workflow_dispatch:
    inputs:
      offer_text:
        description: "Verified Suzuki offer information from Facebook"
        required: true
        type: string
      approve_update:
        description: "Type YES to approve the website update"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check approval
        run: |
          if [ "${{ inputs.approve_update }}" != "YES" ]; then
            echo "Update not approved. Type YES to continue."
            exit 1
          fi

      - name: Read current website
        id: read_site
        run: |
          echo "Current index.html:"
          cat index.html

      - name: Read AI instructions
        id: read_prompt
        run: |
          echo "System instructions:"
          cat system_prompt.txt

      - name: Ask Gemini to update website
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OFFER_TEXT: ${{ inputs.offer_text }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          api_key = os.environ["GEMINI_API_KEY"]
          offer = os.environ["OFFER_TEXT"]

          with open("system_prompt.txt", "r", encoding="utf-8") as f:
              system_prompt = f.read()

          with open("index.html", "r", encoding="utf-8") as f:
              current_html = f.read()

          prompt = f"""
          You are maintaining the Suzuki Kohat Motors landing page.

          Follow these instructions exactly:
          {system_prompt}

          VERIFIED NEW SUZUKI OFFER:
          {offer}

          CURRENT index.html:
          {current_html}

          TASK:
          1. TASK:
0. If the VERIFIED NEW SUZUKI OFFER starts with "TEST ONLY", return the CURRENT index.html unchanged.
1. Review the verified offer.
          2. Update the existing website only where necessary.
          3. Preserve the existing design, layout, responsive behavior,
             booking form, Formspree endpoint, JavaScript functionality,
             contact information, and unrelated content.
          4. Do not invent prices, discounts, specifications, dates,
             features, or claims.
          5. Do not remove existing functionality.
          6. Return ONLY the complete replacement index.html.
          7. Do not use Markdown code fences.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {"text": prompt}
                      ]
                  }
              ]
          }

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.5-flash:generateContent"
              f"?key={api_key}"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
    "Content-Type": "application/json",
    "x-goog-api-key": api_key
},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))

          text = result["candidates"][0]["content"]["parts"][0]["text"]

          if "```html" in text:
              text = text.replace("```html", "", 1)

          if "```" in text:
              text = text.replace("```", "")

          text = text.strip()

          if "<!DOCTYPE html" not in text and "<html" not in text:
              raise Exception("Gemini did not return valid HTML.")

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(text)

          print("index.html successfully updated by Gemini.")
          PY

      - name: Check HTML file
        run: |
          test -s index.html
          grep -qi "<html" index.html
          grep -qi "</html>" index.html
          echo "Basic HTML validation passed."

      - name: Commit and push website update
        run: |
          git config user.name "Suzuki AI Website Agent"
          git config user.email "actions@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No website changes detected."
            exit 0
          fi

          git commit -m "Update Suzuki landing page with new offer"
          git push
